modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Celerbi"
credits = "Independent expansion for Easy Villagers by henkelmax and Farmer's Delight by vectorwing. Optional integrations include Ars Nouveau, Argentum, Croptopia, Fruits Delight, Delightful, Hearth & Harvest, Regions Unexplored, Twilight Forest, Deep Aether, Eternal Starlight, Easy Mob Farm, Jade, JEI and EMI."
logoFile = "easy-farmers-delight-icon.png"
logoBlur = false
description = '''
Forge 1.20.1 edition of Easy Farmer's Delight.
An independent, unofficial expansion that extends Easy Villagers and Farmer's Delight with new automation mechanics.
Adds Paddy/Rich Farmers, Rich Soil farming, persistent and structural crop lifecycles, Grafting Support Orchards with optional fruit-tree providers, Rich Farmer Log Mode, dynamic Cutter work surfaces, client-local Noise Switches, Delightful 3.8.x compatibility and optional Jade/JEI/EMI guidance.
'''

